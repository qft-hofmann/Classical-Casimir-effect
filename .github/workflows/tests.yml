name: Scientific software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install documented runtime
        run: python -m pip install -r requirements.lock -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest -m 'not bem' -q
      - run: python scripts/check_examples.py
      - name: Reproduce data and figure
        run: |
          python scripts/report_data.py
          python scripts/plot_examples.py --destination output/figures
          git diff --exit-code -- reports/data
      - name: Bounded numerical smoke
        run: python scripts/smoke.py
      - name: Shell syntax and lint
        run: |
          shellcheck run-hpc.sh
          cd src/classical_casimir/cluster_templates
          shellcheck -x *.sh *.slurm
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
